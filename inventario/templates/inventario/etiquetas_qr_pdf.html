<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión de Etiquetas QR - Perforosven</title>
    <style>
        @page {
            size: letter;
            margin: 12mm 10mm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 8px;
                color: #555;
            }
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        .grid-container {
            display: block;
            width: 100%;
        }
        /* Layout: 3 columnas de etiquetas */
        .etiqueta-wrapper {
            display: inline-block;
            vertical-align: top;
            width: 31%;
            margin: 1%;
            box-sizing: border-box;
            border: 1px dashed #bbb;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            background-color: #fafafa;
            page-break-inside: avoid;
        }
        .header-logo {
            font-size: 8px;
            font-weight: bold;
            color: #0d6efd;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        .header-logo span {
            color: #ffc107;
        }
        .qr-img {
            display: block;
            margin: 0 auto;
            width: 100px;
            height: 100px;
        }
        .info-codigo {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            font-weight: bold;
            color: #111;
            margin-top: 6px;
            margin-bottom: 2px;
        }
        .info-desc {
            font-size: 8px;
            color: #555;
            height: 22px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 11px;
            margin: 0;
            font-weight: 500;
            text-transform: uppercase;
        }
        .info-tipo {
            display: inline-block;
            font-size: 7px;
            background-color: #e9ecef;
            color: #495057;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        {% for item in items %}
        <div class="etiqueta-wrapper">
            <div class="header-logo">
                PERFOROSVEN<span> WMS</span>
            </div>
            {% if item.codigo_qr %}
                <img class="qr-img" src="{{ item.codigo_qr.path }}" alt="QR">
            {% else %}
                <div style="width: 100px; height: 100px; line-height: 100px; border: 1px solid #ccc; margin: 0 auto; font-size: 9px; color: #999;">Sin QR</div>
            {% endif %}
            
            {% if tipo_item == 'material' %}
                <div class="info-codigo">{{ item.codigo }}</div>
                <p class="info-desc">{{ item.descripcion }}</p>
                <div class="info-tipo">{{ item.tipo }}</div>
            {% else %}
                <div class="info-codigo">{{ item.codigo_activo }}</div>
                <p class="info-desc">{{ item.descripcion }}</p>
                <div class="info-tipo">ACTIVO FIJO</div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
